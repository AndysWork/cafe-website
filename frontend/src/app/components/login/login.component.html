<div class="auth-page">
  <a class="back-home" routerLink="/" aria-label="Back to Home" title="Back to Home">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h14"/></svg>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10Z"/><path d="M9 21v-8h6v8"/></svg>
  </a>
  <img class="auth-background" src="/images/cafe/login-background.png" alt="" aria-hidden="true" width="1152" height="768" fetchpriority="high" />
  <svg class="mobile-welcome" viewBox="90 0 490 310" aria-hidden="true" focusable="false">
    <image href="/images/cafe/login-background.png" width="1152" height="768" />
  </svg>

  <div class="auth-form-panel">
    <div class="form-wrapper">
      <div class="form-header">
        <h1>Sign In</h1>
        <p>Continue to Maa Tara Cafe</p>
      </div>

      <form (ngSubmit)="onLogin()" class="auth-form" aria-label="Sign in form">
        <div class="input-group" [class.has-value]="username">
          <span class="input-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <input
            type="text"
            id="username"
            [(ngModel)]="username"
            name="username"
            placeholder=" "
            required
            autocomplete="username"
          />
          <label for="username">Username</label>
        </div>

        <div class="input-group" [class.has-value]="password">
          <span class="input-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            name="password"
            placeholder=" "
            required
            autocomplete="current-password"
          />
          <label for="password">Password</label>
          <button type="button" class="toggle-password" (click)="togglePassword()" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>

        <div *ngIf="errorMessage" class="error-toast" role="alert">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          <span>{{ errorMessage }}</span>
        </div>

        <button type="submit" class="btn-primary" [disabled]="isLoading">
          <span *ngIf="!isLoading">Sign In</span>
          <svg *ngIf="!isLoading" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12h16m-7-7 7 7-7 7"/></svg>
          <span *ngIf="isLoading" class="btn-loading">
            <span class="spinner"></span>
            Signing in...
          </span>
        </button>

        <a routerLink="/forgot-password" class="forgot-link">Forgot Password?</a>

        <div class="divider">
          <span class="mobile-divider-label">OR</span>
        </div>

        <p class="switch-auth">
          <span>New to Maa Tara Cafe?</span> <a routerLink="/register" [queryParams]="returnUrl ? { returnUrl: returnUrl } : {}">Create Account</a>
        </p>
      </form>
    </div>
  </div>
  <svg class="mobile-food" viewBox="0 310 570 458" aria-hidden="true" focusable="false">
    <image href="/images/cafe/login-background.png" width="1152" height="768" />
  </svg>
</div>
