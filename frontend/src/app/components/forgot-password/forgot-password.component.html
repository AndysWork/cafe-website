<div class="forgot-password-container">
  <div class="recovery-visual">
    <svg class="recovery-logo" viewBox="175 0 240 190" role="img" aria-label="Maa Tara Cafe">
      <image href="/images/cafe/login-background.png" width="1152" height="768" />
    </svg>
    <h2>Forgot Password?</h2>
    <p>No worries! Reset your password<br />and get back to your caf&eacute; experience.</p>
    <svg class="recovery-food" viewBox="0 310 570 458" aria-hidden="true" focusable="false">
      <image href="/images/cafe/login-background.png" width="1152" height="768" />
    </svg>
  </div>
  <div class="forgot-password-box">
    <div class="header">
      <div class="logo" aria-hidden="true">🔐</div>
      <h1>Forgot <span>Password?</span></h1>
      <p *ngIf="!emailSent">Enter your email address and we'll send you a reset link</p>
    </div>

    <div *ngIf="emailSent" class="success-message" role="status">
      <div class="icon">✅</div>
      <h2>Email Sent!</h2>
      <p>{{ message }}</p>
      <p class="check-spam">Please check your inbox and spam folder.</p>
      <button class="btn-primary" routerLink="/login">Back to Login</button>
    </div>

    <form *ngIf="!emailSent" (ngSubmit)="onSubmit()" class="forgot-password-form" aria-label="Password reset form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <svg class="email-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          required
          autocomplete="email"
        />
      </div>

      <div *ngIf="errorMessage" class="error-message" role="alert">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading || !email">
        <span *ngIf="!isLoading">Send Reset Link</span>
        <span *ngIf="isLoading">Sending...</span>
      </button>

      <div class="recovery-divider" aria-hidden="true"><span>OR</span></div>
      <div class="back-link">
        <a routerLink="/login">← Back to Login</a>
      </div>
    </form>
  </div>
  <svg class="mobile-recovery-food" viewBox="0 310 570 458" aria-hidden="true" focusable="false">
    <image href="/images/cafe/login-background.png" width="1152" height="768" />
  </svg>
</div>
