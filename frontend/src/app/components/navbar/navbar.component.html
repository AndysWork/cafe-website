<!-- Mobile Overlay -->
<div
  class="mobile-overlay"
  [class.active]="isMobileMenuOpen"
  (click)="closeMobileMenu()"
></div>

<nav
  class="navbar"
  [class.mobile-open]="isMobileMenuOpen"
  role="navigation"
  aria-label="Main navigation"
>
  <div class="navbar-container">
    <!-- Logo -->
    <a routerLink="/" class="navbar-brand" (click)="closeMobileMenu()">
      <img src="/Logo.jpg" alt="Maa Tara Cafe Logo" class="brand-logo" />
    </a>

    <!-- Mobile Menu Toggle -->
    <button
      class="mobile-menu-toggle"
      [class.active]="isMobileMenuOpen"
      (click)="toggleMobileMenu()"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="isMobileMenuOpen"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <!-- Desktop Menu -->
    <div class="navbar-menu" [class.active]="isMobileMenuOpen">
      <ul class="navbar-nav">
        <li class="nav-item" *ngIf="!isLandingPage">
          <a
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
            (click)="closeMobileMenu()"
          >
            <span class="nav-icon">🏠</span>
            Home
          </a>
        </li>

        <li class="nav-item navigation-group" *ngFor="let group of navigationGroups(); let index = index"
          routerLinkActive="group-active"
          [class.expanded]="activeDropdown === group.label">
          <button
            type="button"
            class="nav-link group-toggle"
            [attr.aria-expanded]="activeDropdown === group.label"
            [attr.aria-controls]="'nav-group-' + index"
            (click)="toggleDropdown(group.label)"
          >
            {{ group.label }}
            <span class="group-arrow" aria-hidden="true">{{ activeDropdown === group.label ? '▴' : '▾' }}</span>
          </button>
          <ul class="navigation-group-menu" [id]="'nav-group-' + index"
            [hidden]="activeDropdown !== group.label">
            <li *ngFor="let item of group.items" [class.cart-item]="item.route === '/cart'">
              <a
                [routerLink]="item.route"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                class="nav-link"
                (click)="closeMobileMenu()"
              >
                <span class="nav-icon" [class.cart-icon]="item.route === '/cart'">
                  {{ item.icon }}
                  <span class="cart-badge" *ngIf="item.route === '/cart' && cartItemCount > 0">{{
                    cartItemCount
                  }}</span>
                </span>
                {{ item.label }}
              </a>
            </li>
          </ul>
        </li>
      </ul>

      <!-- Login/Logout Button -->
      <div class="auth-section">
        <button *ngIf="!isLoggedIn" class="btn-login" (click)="onLogin()">
          <span class="login-icon">🔐</span>
          Login
        </button>

        <!-- Notification Bell (Logged in users) -->
        <app-notification-center *ngIf="isLoggedIn"></app-notification-center>

        <!-- Admin Profile Dropdown -->
        <div
          *ngIf="isLoggedIn && isAdmin"
          class="profile-dropdown"
          [class.active]="activeDropdown === 'profile'"
          (mouseenter)="openDropdown('profile')"
          (mouseleave)="scheduleCloseDropdown()"
        >
          <button
            class="profile-badge"
            (click)="toggleDropdown('profile')"
            aria-haspopup="true"
            [attr.aria-expanded]="activeDropdown === 'profile'"
          >
            <span class="profile-icon">👤</span>
            <span class="username">{{ displayName }}</span>
            <span class="arrow" [class.open]="activeDropdown === 'profile'"
              >▼</span
            >
          </button>

          <ul
            class="dropdown-menu profile-menu"
            [class.show]="activeDropdown === 'profile'"
            (mouseenter)="cancelCloseDropdown()"
            (mouseleave)="scheduleCloseDropdown()"
            role="menu"
          >
            <li>
              <a
                routerLink="/profile"
                routerLinkActive="active"
                class="dropdown-item"
                (click)="closeMobileMenu()"
              >
                <span class="dropdown-icon">✏️</span>
                <div class="dropdown-content">
                  <span class="dropdown-title">Edit Profile</span>
                </div>
              </a>
            </li>
            <li>
              <a
                routerLink="/admin/outlets"
                routerLinkActive="active"
                class="dropdown-item"
                (click)="closeMobileMenu()"
              >
                <span class="dropdown-icon">🏪</span>
                <div class="dropdown-content">
                  <span class="dropdown-title">Outlets</span>
                </div>
              </a>
            </li>
            <li class="divider"></li>
            <li>
              <button class="dropdown-item logout-item" (click)="onLogout()">
                <span class="dropdown-icon">🚪</span>
                <div class="dropdown-content">
                  <span class="dropdown-title">Logout</span>
                </div>
              </button>
            </li>
          </ul>
        </div>

        <!-- Customer Profile Dropdown -->
        <div
          *ngIf="isCustomerLoggedIn"
          class="profile-dropdown customer-profile"
          [class.active]="activeDropdown === 'customer-profile'"
          (mouseenter)="openDropdown('customer-profile')"
          (mouseleave)="scheduleCloseDropdown()"
        >
          <button
            class="profile-badge"
            (click)="toggleDropdown('customer-profile')"
            aria-haspopup="true"
            [attr.aria-expanded]="activeDropdown === 'customer-profile'"
          >
            <span class="profile-icon">👤</span>
            <span class="username">Welcome {{ displayName }}</span>
            <span
              class="arrow"
              [class.open]="activeDropdown === 'customer-profile'"
              >▼</span
            >
          </button>

          <ul
            class="dropdown-menu profile-menu"
            [class.show]="activeDropdown === 'customer-profile'"
            (mouseenter)="cancelCloseDropdown()"
            (mouseleave)="scheduleCloseDropdown()"
            role="menu"
          >
            <li>
              <a
                routerLink="/profile"
                routerLinkActive="active"
                class="dropdown-item primary-profile-item"
                (click)="closeMobileMenu()"
              >
                <span class="dropdown-icon">👤</span>
                <div class="dropdown-content">
                  <span class="dropdown-title">My Profile</span>
                </div>
              </a>
            </li>
            <li class="divider"></li>
            <li>
              <button class="dropdown-item logout-item" (click)="onLogout()">
                <span class="dropdown-icon">🚪</span>
                <div class="dropdown-content">
                  <span class="dropdown-title">Logout</span>
                </div>
              </button>
            </li>
          </ul>
        </div>

        <!-- Non-admin User Display -->
        <div *ngIf="isNonCustomerNonAdminLoggedIn" class="user-section">
          <span class="username">{{ displayName }}</span>
          <button class="btn-logout" (click)="onLogout()">
            <span class="logout-icon">🚪</span>
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>
