<!-- Mobile Overlay -->
<div
  class="mobile-overlay"
  [class.active]="isMobileMenuOpen"
  (click)="closeMobileMenu()"
></div>

<nav
  class="navbar"
  [class.mobile-open]="isMobileMenuOpen"
  [class.landing-navbar]="isLandingPage"
  role="navigation"
  aria-label="Main navigation"
>
  <div class="navbar-container">
    <!-- Logo -->
    <a routerLink="/" class="navbar-brand" (click)="closeMobileMenu()">
      <img src="/Logo.jpg" alt="Maa Tara Cafe Logo" class="brand-logo" />
    </a>

    <!-- Mobile Menu Toggle -->
    <button
      class="mobile-menu-toggle"
      [class.active]="isMobileMenuOpen"
      (click)="toggleMobileMenu()"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="isMobileMenuOpen"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <ng-container *ngTemplateOutlet="cartLink; context: { placement: 'mobile-cart' }"></ng-container>

    <!-- Desktop Menu -->
    <div class="navbar-menu" [class.active]="isMobileMenuOpen">
      <ul class="navbar-nav">
        <li class="landing-links" *ngIf="isLandingPage">
          <a routerLink="/" class="landing-home-link" (click)="closeMobileMenu()">Home</a>
          <a routerLink="/menu" (click)="closeMobileMenu()">Menu</a>
          <button type="button" (click)="openHomePanel('story')" aria-haspopup="dialog">Our Story</button>
          <button type="button" (click)="openHomePanel('offers')" aria-haspopup="dialog">Offers</button>
          <button type="button" (click)="openHomePanel('contact')" aria-haspopup="dialog">Visit Us</button>
        </li>
        <li class="nav-item" *ngIf="!isLandingPage">
          <a
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
            (click)="closeMobileMenu()"
          >
            <span class="nav-icon">🏠</span>
            Home
          </a>
        </li>

        <li class="nav-item" *ngIf="(isCustomerOnly || !isLoggedIn) && !isLandingPage">
          <a routerLink="/menu" routerLinkActive="active" class="nav-link" (click)="closeMobileMenu()"><span class="nav-icon">🍽️</span>Menu</a>
        </li>

        <li class="nav-item navigation-group" *ngFor="let group of navigationGroups(); let index = index"
          routerLinkActive="group-active"
          [class.expanded]="activeDropdown === group.label">
          <button
            type="button"
            class="nav-link group-toggle"
            [attr.aria-expanded]="activeDropdown === group.label"
            [attr.aria-controls]="'nav-group-' + index"
            (click)="toggleDropdown(group.label)"
          >
            {{ group.label }}
            <span class="group-arrow" aria-hidden="true">{{ activeDropdown === group.label ? '▴' : '▾' }}</span>
          </button>
          <ul class="navigation-group-menu" [id]="'nav-group-' + index"
            [hidden]="activeDropdown !== group.label">
            <li *ngFor="let item of group.items" [class.cart-item]="item.route === '/cart'">
              <a
                [routerLink]="item.route"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                class="nav-link"
                (click)="closeMobileMenu()"
              >
                <span class="nav-icon" [class.cart-icon]="item.route === '/cart'">
                  {{ item.icon }}
                  <span class="cart-badge" *ngIf="item.route === '/cart' && cartItemCount > 0">{{
                    cartItemCount
                  }}</span>
                </span>
                {{ item.label }}
              </a>
            </li>
          </ul>
        </li>
      </ul>

      <!-- Login/Logout Button -->
      <div class="auth-section">
        <a *ngIf="isLandingPage" routerLink="/menu" class="landing-order">Order Now <span aria-hidden="true">→</span></a>
        <ng-container *ngTemplateOutlet="cartLink; context: { placement: 'desktop-cart' }"></ng-container>
        <button *ngIf="!isLoggedIn" class="btn-login" (click)="onLogin()">
          <span class="login-icon">🔐</span>
          Login
        </button>

        <!-- Notification Bell (Logged in users) -->
        <app-notification-center *ngIf="isLoggedIn" class="navbar-notification"></app-notification-center>

        <!-- Admin Profile Dropdown -->
        <div
          *ngIf="isLoggedIn && isAdmin"
          class="profile-dropdown"
          [class.active]="activeDropdown === 'profile'"
          (mouseenter)="openDropdown('profile')"
          (mouseleave)="scheduleCloseDropdown()"
        >
          <button
            class="profile-badge"
            (click)="toggleDropdown('profile')"
            aria-haspopup="true"
            [attr.aria-expanded]="activeDropdown === 'profile'"
          >
            <span class="profile-icon">👤</span>
            <span class="username">{{ displayName }}</span>
            <span class="arrow" [class.open]="activeDropdown === 'profile'"
              >▼</span
            >
          </button>

          <ul
            class="dropdown-menu profile-menu"
            [class.show]="activeDropdown === 'profile'"
            (mouseenter)="cancelCloseDropdown()"
            (mouseleave)="scheduleCloseDropdown()"
            role="menu"
          >
            <li>
              <a
                routerLink="/profile"
                routerLinkActive="active"
                class="dropdown-item"
                (click)="closeMobileMenu()"
              >
                <span class="dropdown-icon">✏️</span>
                <div class="dropdown-content">
                  <span class="dropdown-title">Edit Profile</span>
                </div>
              </a>
            </li>
            <li>
              <a
                routerLink="/admin/outlets"
                routerLinkActive="active"
                class="dropdown-item"
                (click)="closeMobileMenu()"
              >
                <span class="dropdown-icon">🏪</span>
                <div class="dropdown-content">
                  <span class="dropdown-title">Outlets</span>
                </div>
              </a>
            </li>
            <li class="divider"></li>
            <li>
              <button class="dropdown-item logout-item" (click)="onLogout()">
                <span class="dropdown-icon">🚪</span>
                <div class="dropdown-content">
                  <span class="dropdown-title">Logout</span>
                </div>
              </button>
            </li>
          </ul>
        </div>

        <!-- Customer Profile Dropdown -->
        <div
          *ngIf="isCustomerLoggedIn"
          class="profile-dropdown customer-profile"
          [class.active]="activeDropdown === 'customer-profile'"
          (mouseenter)="openDropdown('customer-profile')"
          (mouseleave)="scheduleCloseDropdown()"
        >
          <button
            class="profile-badge"
            (click)="toggleDropdown('customer-profile')"
            aria-haspopup="true"
            [attr.aria-expanded]="activeDropdown === 'customer-profile'"
          >
            <span class="profile-icon">👤</span>
            <span class="username">Welcome {{ displayName }}</span>
            <span
              class="arrow"
              [class.open]="activeDropdown === 'customer-profile'"
              >▼</span
            >
          </button>

          <ul
            class="dropdown-menu profile-menu"
            [class.show]="activeDropdown === 'customer-profile'"
            (mouseenter)="cancelCloseDropdown()"
            (mouseleave)="scheduleCloseDropdown()"
            role="menu"
          >
            <li *ngFor="let item of isCustomerOnly ? customerAccountItems : []">
              <a [routerLink]="item.route" routerLinkActive="active" class="dropdown-item" (click)="closeMobileMenu()">
                <span class="dropdown-icon">{{ item.icon }}</span>
                <div class="dropdown-content"><span class="dropdown-title">{{ item.label }}</span></div>
              </a>
            </li>
            <li>
              <a
                routerLink="/profile"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                ariaCurrentWhenActive="page"
                class="dropdown-item primary-profile-item"
                (click)="closeMobileMenu()"
              >
                <span class="dropdown-icon">👤</span>
                <div class="dropdown-content">
                  <span class="dropdown-title">My Profile</span>
                </div>
              </a>
            </li>
            <li class="divider"></li>
            <li>
              <button class="dropdown-item logout-item" (click)="onLogout()">
                <span class="dropdown-icon">🚪</span>
                <div class="dropdown-content">
                  <span class="dropdown-title">Logout</span>
                </div>
              </button>
            </li>
          </ul>
        </div>

        <!-- Non-admin User Display -->
        <div *ngIf="isNonCustomerNonAdminLoggedIn" class="user-section">
          <span class="username">{{ displayName }}</span>
          <button class="btn-logout" (click)="onLogout()">
            <span class="logout-icon">🚪</span>
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>

<ng-template #cartLink let-placement="placement">
  <a *ngIf="isLandingPage || isCustomerOnly || !isLoggedIn" routerLink="/cart" class="landing-cart" [ngClass]="placement" [class.customer-cart]="isCustomerOnly" aria-label="View cart" (click)="closeMobileMenu()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h2l2.5 12h11l2-8H6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.8" fill="currentColor"/><circle cx="18" cy="20" r="1.8" fill="currentColor"/></svg>
    <span class="landing-cart-count" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
  </a>
</ng-template>
